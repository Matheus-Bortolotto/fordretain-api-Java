server.address=127.0.0.1
spring.datasource.url=jdbc:h2:mem:fordretain;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
oracle.datasource.url=${spring.datasource.url}
oracle.datasource.username=sa
oracle.datasource.password=
oracle.datasource.driver-class-name=org.h2.Driver
spring.flyway.locations=classpath:db/local
spring.flyway.baseline-on-migrate=false
