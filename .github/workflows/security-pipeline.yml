name: Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest
    env:
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CRYPTO_SECRET: ${{ secrets.CRYPTO_SECRET }}
      CRYPTO_SALT: ${{ secrets.CRYPTO_SALT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar e rodar testes (unitários + integração)
        run: mvn -B clean verify

  sast:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          build-mode: manual
      - name: Build manual (Java 17, sem depender de autodetecção)
        run: mvn -B clean compile -DskipTests
      - name: Rodar análise SAST
        uses: github/codeql-action/analyze@v4

  sca:
    name: SCA - Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Revisar dependências novas/alteradas
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  secret-scanning:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rodar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-security:
    name: Container Security - Trivy
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem Docker
        run: docker build -t fordretain-api:ci .
      - name: Scan de vulnerabilidades com Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: fordretain-api:ci
          severity: CRITICAL,HIGH
          exit-code: '0'
